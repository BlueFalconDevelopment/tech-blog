[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs credits on the free plan, so skip the build when a
  # push only touches README.md or the newPOSTS/ drafts folder (exit 0 = skip).
  # Re-deploying the same commit, or a diff error, falls through to a build.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)README.md' ':(exclude)newPOSTS'"

[build.environment]
  NODE_VERSION = "22"

# Astro handles trailing-slash redirects and 404s on its own for static output;
# nothing else is required here for Netlify Forms (contact.astro) to work —
# Netlify detects the static `data-netlify="true"` form at build time.
